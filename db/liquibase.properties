# =========================================
# 🎯 Archivo de Propiedades de Liquibase
# (Configurado para tu BBDD 'develop' en Docker)
# =========================================

# --- Conexión a SQL Server ---
# Driver de SQL Server (ya lo pusiste en C:\liquibase\lib)
driver: com.microsoft.sqlserver.jdbc.SQLServerDriver

# URL de conexión JDBC
# Usamos 'localhost:1433' porque tu docker-compose.yml expone ese puerto.
# El nombre de la BBDD es 'codexy_develop' (según tu .env.dev)
# 'trustServerCertificate=true' es VITAL para conectar a BBDD en Docker sin SSL complejo.
url: jdbc:sqlserver://localhost:1433;databaseName=codexy_develop;trustServerCertificate=true

# Credenciales (según tu devops/databases/docker-compose.yml)
username: sa
password: Dev_P@ssw0rd_2025

# --- Configuración de Changelog ---
# Ruta al changelog maestro.
# Esta ruta es relativa a donde ejecutaremos el comando (la raíz 'mi api/').
changelogFile: db/changelog-master.xml

# Directorio de búsqueda (classpath).
# '.' significa "el directorio actual" (la raíz 'mi api/').
searchPath: .